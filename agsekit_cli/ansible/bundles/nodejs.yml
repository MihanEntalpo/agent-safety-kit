---
- name: Install nodejs
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Register Multipass VM
      ansible.builtin.add_host:
        name: "{{ vm_name }}"
        ansible_host: "{{ vm_name }}"
        ansible_connection: agsekit_multipass
        ansible_python_interpreter: /usr/bin/python3

- name: Install Node.js via nvm
  hosts: "{{ vm_name }}"
  gather_facts: true
  vars:
    node_version: "{{ bundle_version | default('lts') }}"
    nvm_dir: "{{ ansible_env.HOME }}/.nvm"
  tasks:
    - name: Ensure nvm is available
      ansible.builtin.stat:
        path: "{{ nvm_dir }}/nvm.sh"
      register: nvm_stat

    - name: Fail when nvm is missing
      ansible.builtin.fail:
        msg: "nvm is not installed. Install the nvm bundle first."
      when: not nvm_stat.stat.exists

    - name: Check for node
      ansible.builtin.shell: >-
        bash -lc "if command -v node >/dev/null 2>&1; then
        node -v;
        elif [ -s '{{ nvm_dir }}/nvm.sh' ]; then
        . '{{ nvm_dir }}/nvm.sh' && nvm use --silent default >/dev/null && node -v;
        else
        exit 1;
        fi"
      register: node_check
      changed_when: false
      failed_when: false

    - name: Install Node.js version
      ansible.builtin.shell: |
        set -euo pipefail
        . "{{ nvm_dir }}/nvm.sh"
        if [ "{{ node_version }}" = "lts" ]; then
          resolved_version="$(nvm version-remote --lts | tail -n 1)"
          if [ -z "$resolved_version" ] || [ "$resolved_version" = "N/A" ]; then
            echo "Failed to resolve the current LTS Node.js release from nvm version-remote --lts." >&2
            exit 1
          fi
          nvm install "$resolved_version"
          nvm alias default "$resolved_version"
        else
          nvm install "{{ node_version }}"
          nvm alias default "{{ node_version }}"
        fi
      args:
        executable: /bin/bash
      when: (node_version != "lts") or node_check.rc != 0
