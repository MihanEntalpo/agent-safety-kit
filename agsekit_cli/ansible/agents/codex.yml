---
- name: Install Codex
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Register Multipass VM
      ansible.builtin.add_host:
        name: "{{ vm_name }}"
        ansible_host: "{{ vm_name }}"
        ansible_connection: agsekit_multipass
        ansible_python_interpreter: /usr/bin/python3

- name: Install official standalone Codex package
  hosts: "{{ vm_name }}"
  gather_facts: true
  vars:
    requested_agent_version: "{{ agent_version }}"
    codex_install_script: /tmp/agsekit-codex-install.sh
    codex_user_path: "{{ ansible_env.HOME }}/.local/bin/codex"
    codex_package_root: "{{ ansible_env.HOME }}/.codex/packages/standalone/current"
  tasks:
    - name: Configure proxychains
      ansible.builtin.include_tasks: "{{ playbook_dir }}/proxychains.yml"

    - name: Configure Codex logrotate
      ansible.builtin.include_tasks: "{{ playbook_dir }}/codex_logrotate.yml"

    - name: Install Codex dependencies
      ansible.builtin.apt:
        update_cache: true
        name:
          - bubblewrap
          - ca-certificates
          - curl
          - gzip
          - tar
      become: true

    - name: Remove legacy npm-managed Codex when present
      ansible.builtin.shell: |
        set -euo pipefail
        nvm_dir="{{ ansible_env.HOME }}/.nvm"
        if [ -s "$nvm_dir/nvm.sh" ]; then
          . "$nvm_dir/nvm.sh"
          nvm use --silent default >/dev/null 2>&1 || true
        fi
        if command -v npm >/dev/null 2>&1; then
          npm uninstall -g @openai/codex >/dev/null 2>&1 || true
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Download official Codex standalone installer
      ansible.builtin.command: >-
        {{ proxychains_prefix }}curl -fsSL https://chatgpt.com/codex/install.sh
        -o {{ codex_install_script }}
      changed_when: true

    - name: Install official Codex standalone package
      ansible.builtin.command: >-
        {{ proxychains_prefix }}env
        CODEX_NON_INTERACTIVE=1
        CODEX_RELEASE={{ requested_agent_version or 'latest' }}
        sh {{ codex_install_script }}
      changed_when: true

    - name: Verify official Codex standalone package files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ codex_package_root }}/codex-package.json"
        - "{{ codex_package_root }}/bin/codex"
        - "{{ codex_package_root }}/bin/codex-code-mode-host"
        - "{{ codex_package_root }}/codex-path/rg"
        - "{{ codex_package_root }}/codex-resources/bwrap"
      register: codex_package_files

    - name: Fail when the Codex standalone package is incomplete
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Official Codex standalone package is incomplete: {{ item.item }} is missing"
      loop: "{{ codex_package_files.results }}"

    - name: Verify Codex CLI after installation
      ansible.builtin.command: "{{ codex_user_path }} --version"
      changed_when: false

    - name: Remove Codex installer
      ansible.builtin.file:
        path: "{{ codex_install_script }}"
        state: absent
