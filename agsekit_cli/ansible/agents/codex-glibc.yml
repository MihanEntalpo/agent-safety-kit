---
- name: Install codex-glibc
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Register Multipass VM
      ansible.builtin.add_host:
        name: "{{ vm_name }}"
        ansible_host: "{{ vm_name }}"
        ansible_connection: agsekit_multipass
        ansible_python_interpreter: /usr/bin/python3

- name: Build Codex glibc binary
  hosts: "{{ vm_name }}"
  gather_facts: true
  vars:
    requested_agent_version: "{{ agent_version }}"
    reinstall_requested: "{{ force_reinstall | default(false) | bool }}"
    codex_build_root: /tmp/codex-src
    codex_binary_name: codex-glibc
    codex_system_path: /usr/local/bin/codex-glibc
    codex_user_path: "{{ ansible_env.HOME }}/.local/bin/codex-glibc"
    codex_required_free_kb: 3145728
    codex_min_swap_kb: 1048576
  tasks:
    - name: Configure proxychains
      ansible.builtin.include_tasks: "{{ playbook_dir }}/proxychains.yml"

    - name: Configure Codex logrotate
      ansible.builtin.include_tasks: "{{ playbook_dir }}/codex_logrotate.yml"

    - name: Install build dependencies
      ansible.builtin.apt:
        update_cache: true
        name:
          - bubblewrap
          - build-essential
          - pkg-config
          - libssl-dev
          - curl
          - git
      become: true

    - name: Check for codex-glibc binary (system)
      ansible.builtin.stat:
        path: "{{ codex_system_path }}"
      register: codex_system_stat

    - name: Check for codex-glibc binary (user)
      ansible.builtin.stat:
        path: "{{ codex_user_path }}"
      register: codex_user_stat

    - name: Check sudo availability
      ansible.builtin.command: sudo -n true
      register: sudo_check
      changed_when: false
      failed_when: false

    - name: Check available memory
      ansible.builtin.shell: "awk '/MemAvailable:/ {mem=$2} /SwapFree:/ {swap=$2} END {print mem+swap}' /proc/meminfo"
      register: free_kb
      changed_when: false

    - name: Determine swap requirements
      ansible.builtin.set_fact:
        swap_required_kb: "{{ codex_required_free_kb - (free_kb.stdout | int) }}"
        swap_required_effective_kb: "{{ [codex_required_free_kb - (free_kb.stdout | int), codex_min_swap_kb] | max }}"

    - name: Create swap file when needed
      ansible.builtin.shell: |
        set -euo pipefail
        SWAP_FILE="$(sudo mktemp /var/tmp/codex-glibc-swap-XXXXXX)"
        echo "$SWAP_FILE"
      register: swap_file
      changed_when: true
      when: swap_required_kb | int > 0
      args:
        executable: /bin/bash

    - name: Enable swap file
      ansible.builtin.shell: |
        set -euo pipefail
        swap_bytes=$(({{ swap_required_effective_kb | int }} * 1024))
        swap_mb=$((({{ swap_required_effective_kb | int }} + 1023) / 1024))
        if command -v fallocate >/dev/null 2>&1; then
        sudo fallocate -l "$swap_bytes" "{{ swap_file.stdout }}"
        else
          sudo dd if=/dev/zero of="{{ swap_file.stdout }}" bs=1M count="$swap_mb" status=none
        fi
        sudo chmod 600 "{{ swap_file.stdout }}"
        sudo mkswap "{{ swap_file.stdout }}" >/dev/null
        sudo swapon "{{ swap_file.stdout }}"
      when: swap_required_kb | int > 0
      args:
        executable: /bin/bash

    - name: Fail when system codex-glibc exists but sudo is unavailable
      ansible.builtin.fail:
        msg: >-
          codex-glibc already exists at {{ codex_system_path }}, but sudo is unavailable,
          so agsekit cannot replace the installed binary.
      when: codex_system_stat.stat.exists and sudo_check.rc != 0

    - name: Determine codex-glibc install target
      ansible.builtin.set_fact:
        codex_install_mode: >-
          {{ 'system' if codex_system_stat.stat.exists or (not codex_user_stat.stat.exists and sudo_check.rc == 0) else 'user' }}
        codex_install_path: >-
          {{ codex_system_path if codex_system_stat.stat.exists or (not codex_user_stat.stat.exists and sudo_check.rc == 0) else codex_user_path }}

    - name: Remove existing codex-glibc before reinstall
      ansible.builtin.command: >-
        {{ 'sudo ' if codex_install_mode == 'system' else '' }}rm -f {{ codex_install_path }}
      when: reinstall_requested
      changed_when: true

    - name: Remove previous codex build root
      ansible.builtin.file:
        path: "{{ codex_build_root }}"
        state: absent

    - name: Check rustup availability
      ansible.builtin.shell: "bash -lc 'command -v rustup'"
      register: rustup_check
      changed_when: false
      failed_when: false

    - name: Download rustup installer
      ansible.builtin.command: "{{ proxychains_prefix }}curl --proto '=https' --tlsv1.2 -fL https://sh.rustup.rs -o /tmp/rustup-init.sh"
      when: rustup_check.rc != 0

    - name: Install rustup
      ansible.builtin.command: /bin/sh /tmp/rustup-init.sh -y --no-modify-path
      environment:
        RUSTUP_INIT_SKIP_PATH_CHECK: "yes"
      when: rustup_check.rc != 0

    - name: Ensure cargo bin directory
      ansible.builtin.set_fact:
        cargo_bin: "{{ ansible_env.HOME }}/.cargo/bin"

    - name: Resolve host target
      ansible.builtin.shell: "{{ cargo_bin }}/rustc -Vv | awk '/^host:/ {print $2}'"
      register: rustc_info
      changed_when: false
      failed_when: false
      args:
        executable: /bin/bash

    - name: Set host target
      ansible.builtin.set_fact:
        host_target: "{{ rustc_info.stdout | trim | default(ansible_architecture ~ '-unknown-linux-gnu', true) }}"

    - name: Add rust target
      ansible.builtin.command: "{{ cargo_bin }}/rustup target add {{ host_target }}"

    - name: Clone codex repository
      ansible.builtin.command: >-
        {{ proxychains_prefix }}git clone --branch {{ ('rust-v' ~ requested_agent_version) if requested_agent_version else 'main' }} --depth 1 https://github.com/openai/codex.git {{ codex_build_root }}/codex
      changed_when: true

    - name: Locate Cargo manifest
      ansible.builtin.shell: |
        python3 - <<'PYCODE'
        import pathlib
        import sys
        import tomllib

        root = pathlib.Path("{{ codex_build_root }}/codex")
        candidates = []
        for path in root.rglob("Cargo.toml"):
            try:
                data = tomllib.loads(path.read_text(encoding="utf-8"))
            except Exception:
                continue

            pkg_name = data.get("package", {}).get("name")
            bins = data.get("bin", []) or []
            has_codex_bin = any(isinstance(item, dict) and item.get("name") == "codex" for item in bins)
            score = 0
            if pkg_name == "codex-cli":
                score = 3
            elif has_codex_bin:
                score = 2
            elif pkg_name == "codex":
                score = 1

            if score:
                candidates.append((score, len(path.parts), str(path)))

        if not candidates:
            sys.exit(1)

        best = sorted(candidates, key=lambda item: (-item[0], item[1]))[0]
        print(best[2])
        PYCODE
      register: manifest_path
      changed_when: false
      args:
        executable: /bin/bash

    - name: Raise rustc query recursion limit for codex-exec
      ansible.builtin.shell: >-
        set -euo pipefail;
        codex_exec_lib="$(dirname "{{ manifest_path.stdout }}")/src/lib.rs";
        if [ -f "$codex_exec_lib" ] && ! grep -qF '#![recursion_limit = "256"]' "$codex_exec_lib"; then
          sed -i '1i#![recursion_limit = "256"]' "$codex_exec_lib";
        fi
      args:
        executable: /bin/bash

    - name: Build codex-glibc
      ansible.builtin.command: >-
        {{ proxychains_prefix }}bash -lc "export PATH={{ cargo_bin }}:$PATH;
        export CARGO_TARGET_DIR={{ ansible_env.HOME }}/.tmp/build-codex-glibc/target;
        mkdir -p {{ ansible_env.HOME }}/.tmp/build-codex-glibc/target;
        export CARGO_BUILD_JOBS=1;
        export CARGO_PROFILE_RELEASE_LTO=off;
        export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1;
        export CARGO_PROFILE_RELEASE_DEBUG=false;
        cargo build --release --target {{ host_target }} --manifest-path {{ manifest_path.stdout }}"
      changed_when: true

    - name: Install codex-glibc system-wide
      ansible.builtin.command: >-
        sudo install -m 0755 {{ ansible_env.HOME }}/.tmp/build-codex-glibc/target/{{ host_target }}/release/codex {{ codex_system_path }}
      when: codex_install_mode == "system"
      register: codex_install_system
      failed_when: codex_install_system.rc != 0

    - name: Ensure user bin directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.local/bin"
        state: directory
        mode: "0755"
      when: codex_install_mode == "user"

    - name: Install codex-glibc to user bin
      ansible.builtin.command: >-
        install -m 0755 {{ ansible_env.HOME }}/.tmp/build-codex-glibc/target/{{ host_target }}/release/codex {{ codex_user_path }}
      when: codex_install_mode == "user"

    - name: Ensure user bin in PATH
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME }}/.profile"
        line: 'export PATH="$HOME/.local/bin:$PATH"'
        create: true
      when: codex_install_mode == "user"

    - name: Verify codex-glibc binary exists
      ansible.builtin.stat:
        path: "{{ codex_install_path }}"
      register: installed_codex_stat

    - name: Verify codex-glibc binary works
      ansible.builtin.command: "{{ codex_install_path }} --version"
      register: codex_version_check
      changed_when: false

    - name: Cleanup rust and cargo toolchains used for build
      ansible.builtin.shell: |
        set -euo pipefail
        if [ -x "{{ ansible_env.HOME }}/.cargo/bin/rustup" ]; then
          "{{ ansible_env.HOME }}/.cargo/bin/rustup" self uninstall -y || true
        fi
        rm -rf "{{ ansible_env.HOME }}/.cargo" "{{ ansible_env.HOME }}/.rustup"
      when:
        - not codex_glibc_installed
        - installed_codex_stat.stat.exists
        - codex_version_check.rc == 0
      args:
        executable: /bin/bash

    - name: Remove swap file
      ansible.builtin.shell: |
        sudo swapoff "{{ swap_file.stdout }}" 2>/dev/null || true
        sudo rm -f "{{ swap_file.stdout }}"
      when: not codex_glibc_installed and swap_required_kb | int > 0
      args:
        executable: /bin/bash
